name: ASTA home storage storyboard MP4
on:
  push:
    branches: [feat/asta-home-battery-storyboard-reel-20261024]
    paths:
      - 'brands/asta-energy/projects/asta-home-battery-editorial-reel.json'
      - '.github/workflows/asta-home-battery-reel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /pyproject.toml
            /brands/asta-energy/brand.json
            /brands/asta-energy/BRAND.md
            /brands/asta-energy/assets/logo.png
            /brands/asta-energy/projects/asta-home-battery-editorial-reel.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Reel Maker with icons and static FFmpeg
        run: python -m pip install --disable-pip-version-check -e '.[icons]' static-ffmpeg==3.0
      - name: Setup portable encoder
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from static_ffmpeg.run import get_or_fetch_platform_executables_else_raise
          ffmpeg, ffprobe = get_or_fetch_platform_executables_else_raise()
          with open(os.environ["GITHUB_PATH"],"a",encoding="utf-8") as file:
              print(Path(ffmpeg).parent,file=file)
          PY
      - name: Build project and validate actual scenes
        run: |
          mkdir -p renders/asta-energy
          reels-maker studio-inspect brands/asta-energy/projects/asta-home-battery-editorial-reel.json --json > renders/asta-energy/home-storage-inspect.json
          reels-maker studio-qa brands/asta-energy/projects/asta-home-battery-editorial-reel.json --strict --no-contact-sheet --json > renders/asta-energy/home-storage-qa.json
      - name: Render actual MP4 using native Studio renderer
        run: |
          reels-maker studio-render brands/asta-energy/projects/asta-home-battery-editorial-reel.json --output renders/asta-energy/home-storage-editorial.mp4 --supersample 1 --json > renders/asta-energy/home-storage-render.json
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,nb_frames,duration -of json renders/asta-energy/home-storage-editorial.mp4 > renders/asta-energy/home-storage-probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("renders/asta-energy/home-storage-render.json").read_text())
          probe=json.loads(Path("renders/asta-energy/home-storage-probe.json").read_text())["streams"][0]
          assert report["ok"],report
          assert probe["codec_name"]=="h264",probe
          assert Path("renders/asta-energy/home-storage-editorial.mp4").stat().st_size>100000
          print("Verified actual Reel Maker MP4",probe)
          PY
      - name: Upload render and QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asta-home-battery-editorial-mp4
          path: renders/asta-energy/home-storage-*
          if-no-files-found: ignore
          retention-days: 14
