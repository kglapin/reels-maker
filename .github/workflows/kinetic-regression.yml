name: Kinetic reference regression

on:
  push:
    branches: [feat/kinetic-motion-primitives-20261023]

permissions:
  contents: read

jobs:
  kinetic-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /tests/test_kinetics.py
            /tests/test_rich_typography.py
            /pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Run kinetic and motion unit checks
        run: |
          python -m unittest discover -s tests -p 'test_kinetics.py' -v
          python -m unittest discover -s tests -p 'test_rich_typography.py' -v
      - name: Compile Python sources
        run: python -m compileall -q src/reels_maker
