name: Object-driven transitions demo

on:
  push:
    branches:
      - feat/object-driven-transitions-20261023
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: object-transitions-demo
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /examples/object-driven-transition-demo.json
            /pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2
          python -m pip install -e '.[icons]'
      - name: Render actual studio demo
        run: |
          reels-maker studio-inspect examples/object-driven-transition-demo.json > inspect.json
          reels-maker studio-render examples/object-driven-transition-demo.json --output transition-demo.mp4 --supersample 1 > render.json
          ffprobe -v error -show_entries stream=width,height,nb_frames,codec_name -of json transition-demo.mp4 > ffprobe.json
      - name: Verify duration and transition frames
        run: |
          python - <<'PY'
          import json
          d=json.load(open("render.json"))
          assert d["ok"] and d["frames"]==345, d
          p=json.load(open("ffprobe.json"))
          v=next(x for x in p["streams"] if x["codec_name"]=="h264")
          assert int(v["nb_frames"])==345
          assert (v["width"],v["height"])==(540,960)
          print("Verified 345 frames and 4 transitions")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: object-driven-transition-demo
          path: |
            transition-demo.mp4
            render.json
            ffprobe.json
          retention-days: 7
