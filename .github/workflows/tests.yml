name: reels-maker Python tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the latest commit for a given branch or pull request needs runner minutes.
concurrency:
  group: reels-maker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Syntax and manifest contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /tests/
            /brands/*/brand.json
            /brands/*/media/asset-reviews.json
            /brands/*/projects/
            /pyproject.toml
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile modules and tests without importing media dependencies
        run: python -m compileall -q src/reels_maker tests
      - name: Validate every project JSON parses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("brands").glob("*/projects/*.json"))
          assert files, "No manifests found"
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"Validated {len(files)} project JSON manifests")
          PY
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /src/
            /tests/
            /brands/*/brand.json
            /brands/*/media/asset-reviews.json
            /brands/*/assets/logo.png
            /brands/*/projects/
            /pyproject.toml
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[brand]"
      # Runner images often already provide FFmpeg: avoid an unnecessary apt
      # update on every commit; install only if either executable is missing.
      - name: Make APT robust to unavailable optional mirrors
        run: |
          # Some hosted runners ship a 3rd-party Microsoft APT feed that
          # intermittently responds 403. It is unrelated to FFmpeg/fonts.
          while IFS= read -r source; do
            sudo mv "$source" "$source.disabled"
          done < <(sudo grep -lr 'packages.microsoft.com' \
            /etc/apt/sources.list.d --include='*.list' --include='*.sources' || true)
      - name: Ensure reproducible FFmpeg and FFprobe binaries
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            python -m pip install 'static-ffmpeg==3.0'
            python - <<'PY'
          import os
          from pathlib import Path
          from static_ffmpeg.run import get_or_fetch_platform_executables_else_raise
          ffmpeg, ffprobe = get_or_fetch_platform_executables_else_raise()
          assert Path(ffmpeg).is_file() and Path(ffprobe).is_file()
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as handle:
              handle.write(str(Path(ffmpeg).parent) + "\n")
          print("Portable FFmpeg/FFprobe loaded:", ffmpeg, ffprobe)
          PY
            export PATH="$(python -c 'from static_ffmpeg.run import get_or_fetch_platform_executables_else_raise as r; from pathlib import Path; print(Path(r()[0]).parent)'):$PATH"
          fi
          # FFmpeg binary and source version must remain visible in the logs.
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - run: python -m unittest discover -s tests -v


  brandbook:
    name: Export brandbook (without FFmpeg)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /tests/test_brandbook.py
            /brands/asta-energy/brand.json
            /brands/asta-energy/assets/logo.png
            /pyproject.toml
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install PDF-only dependency
        run: python -m pip install -e ".[pdf]"
      - name: Test brandbook generation with real logo
        run: python -m unittest discover -s tests -p test_brandbook.py -v
      - name: Generate ASTA Energy brandbook
        run: reels-maker brandbook --brand asta-energy --root . --json
      - uses: actions/upload-artifact@v4
        with:
          name: asta-energy-brandbook
          path: renders/asta-energy/brandbook.pdf
          if-no-files-found: error
          retention-days: 14
