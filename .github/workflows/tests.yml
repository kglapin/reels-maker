name: reels-maker Python tests
on:
  push:
    branches:
      - refactor/modular-render-engine
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /src/
            /tests/
            /brands/*/brand.json
            /brands/*/assets/logo.png
            /brands/*/projects/
            /pyproject.toml
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[brand]"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m unittest discover -s tests -v
      - name: Generate ASTA Energy PDF brandbook
        run: reels-maker brandbook --brand asta-energy --root . --json
      - name: Publish PDF brandbook preview
        uses: actions/upload-artifact@v4
        with:
          name: asta-energy-brandbook
          path: renders/asta-energy/brandbook.pdf
          if-no-files-found: error
          retention-days: 14
