[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reels-maker"
version = "0.1.0"
description = "Portable, configuration-driven multi-format video renderer"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
pdf = ["reportlab>=4,<5"]
brand = ["reportlab>=4,<5", "tinycss2>=1.3,<2"]
kinetic = ["cairocffi>=1.6,<2", "Pillow>=10,<13"]
icons = ["CairoSVG>=2.7,<3"]
xlsx = ["openpyxl>=3.1,<4"]

[project.scripts]
reels-maker = "reels_maker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reels_maker.creative" = ["reference_data/*.json"]
