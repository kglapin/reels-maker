[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reels-maker"
version = "0.1.0"
description = "Portable, configuration-driven multi-format video renderer"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
pdf = ["reportlab>=4,<5"]

[project.scripts]
reels-maker = "reels_maker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
